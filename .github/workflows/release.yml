name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # ci-gate reads this repo's CI runs via `gh run list`. Declaring any
  # `permissions:` block zeroes every scope not listed, so without this the
  # gate 403s instead of gating.
  actions: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-macos
            artifact: kaappi-aarch64-macos
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          # Mainstream Linux targets build against glibc (floor 2.28 —
          # RHEL 8 / Debian 10 / Ubuntu 18.10 and newer) instead of Zig's
          # default musl-static: static musl cannot dlopen, which made
          # every released Linux binary reject (kaappi ffi) and with it
          # the whole C-extension ecosystem (net/http/sqlite/pg/redis/
          # crypto) — kaappi-lang.org's docs-samples CI caught it. The
          # linux-ffi-smoke job below gates the release on dlopen working.
          # `target` stays the artifact-naming key (install.sh matches
          # libkaappi_rt-<target>.a); `zig_target` is what we compile for.
          # Trade-off: glibc binaries don't run on musl distros (Alpine) —
          # those users build from source until a musl-dynamic variant
          # ships as an extra artifact.
          - os: ubuntu-latest
            target: x86_64-linux
            zig_target: x86_64-linux-gnu.2.28
            artifact: kaappi-x86_64-linux
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          - os: ubuntu-24.04-arm
            target: aarch64-linux
            zig_target: aarch64-linux-gnu.2.28
            artifact: kaappi-aarch64-linux
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          # riscv64 is native-tier since 2026-09 (the archive is what
          # `kaappi compile` links on a riscv64 box; ci.yml's
          # riscv64-native-test exercises this row's code under QEMU,
          # cross-built with the musl default for sysroot-free linking —
          # see run-e2e-cross.sh's header; the gnu-archive coverage is
          # the 2026-09-14 postmortem's 38/38 e2e run with a
          # `-Dtarget=riscv64-linux-gnu` archive). Same glibc-2.28
          # floor as the two rows above, for the
          # same reason: #1783 deliberately left this row on Zig's
          # musl-static default because riscv64 was interpreter-tier
          # then, so the shipped binary could not dlopen (kaappi ffi)
          # (#2595) — while `kaappi compile` on a riscv64 box already
          # linked the archive against the host's glibc, leaving the
          # shipped `kaappi` the odd ABI out. Zig 0.16's riscv64 glibc
          # stubs reach 2.28. Same trade-off too: no Alpine riscv64.
          # The linux-ffi-smoke job runs this artifact under QEMU.
          - os: ubuntu-latest
            target: riscv64-linux
            zig_target: riscv64-linux-gnu.2.28
            artifact: kaappi-riscv64-linux
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          # Interpreter-tier Linux arches (no native backend).
          # Cross-compiled; execution is verified by CI's
          # s390x-test/ppc64le-test QEMU jobs and was validated on
          # real-kernel Alpine VMs (#1654). s390x is the only big-endian
          # target.
          - os: ubuntu-latest
            target: s390x-linux
            artifact: kaappi-s390x-linux
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          - os: ubuntu-latest
            target: powerpc64le-linux
            artifact: kaappi-powerpc64le-linux
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          # Cross-compiled from Linux (Zig bundles FreeBSD 14+ libc).
          # Execution is verified by CI's freebsd-test VM job (x86_64)
          # and on the port's aarch64 reference machine
          # (docs/dev/freebsd.md).
          - os: ubuntu-latest
            target: x86_64-freebsd
            artifact: kaappi-x86_64-freebsd
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          - os: ubuntu-latest
            target: aarch64-freebsd
            artifact: kaappi-aarch64-freebsd
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          # Cross-compiled from Linux. `zig build` marks each binary
          # PT_OPENBSD_NOBTCFI via the host patcher (build.zig) so it survives
          # OpenBSD's BTCFI enforcement; the marker is a program header that
          # stripping preserves. Execution is verified by CI's openbsd-test VM
          # job (x86_64) and on the aarch64 reference machine
          # (docs/dev/openbsd.md).
          - os: ubuntu-latest
            target: x86_64-openbsd
            artifact: kaappi-x86_64-openbsd
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          - os: ubuntu-latest
            target: aarch64-openbsd
            artifact: kaappi-aarch64-openbsd
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          # Cross-compiled from Linux. Execution is verified by CI's
          # netbsd-test VM job (x86_64) and on the NetBSD 10.1 aarch64
          # reference machine (docs/dev/netbsd.md). The native backend on
          # NetBSD needs pkgsrc clang at runtime (base cc is GCC).
          - os: ubuntu-latest
            target: x86_64-netbsd
            artifact: kaappi-x86_64-netbsd
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          - os: ubuntu-latest
            target: aarch64-netbsd
            artifact: kaappi-aarch64-netbsd
            exe_ext: ''
            lib_src: libkaappi_rt.a
            lib_ext: .a
            strip: true
          # Cross-compiled via Zig's bundled mingw-w64; execution is
          # verified on real Windows 11 ARM64 hardware (docs/dev/windows.md)
          # since GitHub has no ARM64 Windows runners. The gnu-ABI static
          # lib is emitted as kaappi_rt.lib on this target. strip: false —
          # under strip, Zig 0.16.0's LLVM miscompiles threadlocal access
          # on aarch64-windows (#1607, upstream ziglang#31865), so a
          # stripped kaappi.exe access-violates at startup; re-enable at
          # the toolchain bump (#1613). thottam is unaffected but ships
          # unstripped for consistency.
          - os: ubuntu-latest
            target: aarch64-windows
            artifact: kaappi-aarch64-windows.exe
            exe_ext: .exe
            lib_src: kaappi_rt.lib
            lib_ext: .lib
            strip: false
          # Same cross-compiled mingw-w64 path; execution is verified by
          # CI's windows-x64-test job on the x86_64 windows-latest
          # runners and under x64 emulation on the Windows 11 ARM64
          # reference machine (docs/dev/windows.md). strip: true — the
          # #1607 threadlocal miscompile is aarch64-COFF-specific; a
          # stripped x86_64 kaappi.exe runs correctly (VM-verified).
          - os: ubuntu-latest
            target: x86_64-windows
            artifact: kaappi-x86_64-windows.exe
            exe_ext: .exe
            lib_src: kaappi_rt.lib
            lib_ext: .lib
            strip: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0

      - name: Build release binaries and runtime library
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig_target || matrix.target }} -Dstrip=${{ matrix.strip }}
          zig build lib -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig_target || matrix.target }}

      - name: Sign and notarize macOS binaries
        if: matrix.target == 'aarch64-macos'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Import certificate into temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Sign with Developer ID and hardened runtime
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --entitlements .github/kaappi.entitlements zig-out/bin/kaappi
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --entitlements .github/kaappi.entitlements zig-out/bin/thottam

          # Notarize both binaries
          zip notarize.zip zig-out/bin/kaappi zig-out/bin/thottam
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --wait

          # Cleanup
          security delete-keychain "$KEYCHAIN_PATH"

      - name: Rename binaries
        run: |
          cp zig-out/bin/kaappi${{ matrix.exe_ext }} ${{ matrix.artifact }}
          cp zig-out/bin/thottam${{ matrix.exe_ext }} thottam-${{ matrix.target }}${{ matrix.exe_ext }}
          cp zig-out/lib/${{ matrix.lib_src }} libkaappi_rt-${{ matrix.target }}${{ matrix.lib_ext }}

      - name: Upload kaappi artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

      - name: Upload thottam artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thottam-${{ matrix.target }}${{ matrix.exe_ext }}
          path: thottam-${{ matrix.target }}${{ matrix.exe_ext }}
          retention-days: 1

      - name: Upload libkaappi_rt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libkaappi_rt-${{ matrix.target }}
          path: libkaappi_rt-${{ matrix.target }}${{ matrix.lib_ext }}
          retention-days: 1

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0

      - name: Build WASM
        run: zig build wasm

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaappi-wasm32-wasi
          path: zig-out/bin/kaappi.wasm
          retention-days: 1

  # The bug this guards against: a Linux artifact built without working
  # dynamic loading (e.g. Zig's default musl-static target) passes every
  # build step but cannot load a single C-extension library once
  # installed. Run the actual release artifact and prove dlopen works
  # before anything is published. Every glibc Linux row in `build` must
  # have a leg here — riscv64 had none from #1783 (2026-07) until #2595,
  # so its binary shipped musl-static with nothing to notice.
  linux-ffi-smoke:
    needs: build
    # Two tiny programs per leg; the cap exists for the riscv64 leg,
    # which runs under TCG, and riscv64-under-TCG legs do wedge (#2488).
    # Without it a stuck `docker run` holds the tag's publish on the
    # 360-minute runner default instead of failing in minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kaappi-x86_64-linux
          - os: ubuntu-24.04-arm
            artifact: kaappi-aarch64-linux
          # No GitHub runner executes riscv64, so this leg runs the same
          # commands under QEMU user-mode inside the pinned
          # riscv64/ubuntu image ci.yml's riscv64-native-test uses
          # (glibc 2.39, which has libm.so.6). `emulate` gates the QEMU
          # setup steps and the container prefix; the native rows above
          # leave it unset and run the artifact directly, as before.
          - os: ubuntu-latest
            artifact: kaappi-riscv64-linux
            emulate: riscv64
    runs-on: ${{ matrix.os }}
    env:
      # riscv64/ubuntu:24.04 as of 2026-09-07 — the same digest ci.yml
      # pins; bump both deliberately.
      RV_IMAGE: riscv64/ubuntu:24.04@sha256:f28b71827ff6cb4fe9b6b536b583bc0227072516de20c9225847be7722ab5715
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}

      - name: Set up QEMU
        if: matrix.emulate == 'riscv64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: riscv64

      - name: Pull the riscv64 base image
        if: matrix.emulate == 'riscv64'
        run: docker pull --platform linux/riscv64 "$RV_IMAGE"

      - name: Smoke-test interpreter and dynamic loading
        # `kaappi` is the artifact itself on a native runner and the
        # artifact inside the emulated container on the riscv64 leg
        # (`-i` forwards the piped stdin; the artifact reads /dev/stdin
        # inside). Both greps run on the runner, and the step's shell is
        # bash -eo pipefail, so a wrong answer -- or a binary that
        # refuses to dlopen -- fails the job either way.
        run: |
          chmod +x ${{ matrix.artifact }}
          kaappi=./${{ matrix.artifact }}
          if [ "${{ matrix.emulate }}" = riscv64 ]; then
            kaappi="docker run --rm -i --platform linux/riscv64 -v $PWD:$PWD -w $PWD $RV_IMAGE ./${{ matrix.artifact }}"
          fi
          echo '(display (+ 1 2)) (newline)' | $kaappi /dev/stdin | grep -qx '3'
          printf '(import (kaappi ffi))\n(define libm (ffi-open "libm.so.6"))\n(define c-sqrt (ffi-fn libm "sqrt" (quote (double)) (quote double)))\n(display (c-sqrt 4.0)) (newline)\n' \
            | $kaappi /dev/stdin | grep -qx '2.0'
          echo "dynamic loading OK"

  # The tag push and the `main` push start ci.yml and release.yml as two
  # independent runs, so without this they race -- and publishing wins. v0.22.1
  # went public at 06:35:24 with CI on the same commit still running, and would
  # have published just the same had CI failed. Builds below run in parallel
  # with CI regardless; only the publish waits, so gating costs no wall clock
  # unless CI is genuinely the long pole.
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "Waiting for CI on $SHA"

          # A tag pushed at the same moment as the branch can beat its own CI
          # run into existence, so absence is retried rather than fatal.
          for attempt in $(seq 1 80); do
            read -r status conclusion url <<<"$(
              gh run list --repo "$REPO" --workflow=ci.yml --commit="$SHA" \
                --limit 1 --json status,conclusion,url \
                --jq '.[0] // empty | "\(.status) \(.conclusion // "-") \(.url)"' 2>/dev/null || echo "")"

            case "${status:-}" in
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "CI passed: $url"
                  exit 0
                fi
                echo "::error::CI concluded '$conclusion' for $SHA -- refusing to publish. $url"
                exit 1
                ;;
              "")
                echo "attempt $attempt: no CI run found yet for $SHA"
                ;;
              *)
                echo "attempt $attempt: CI $status -- $url"
                ;;
            esac
            sleep 60
          done

          echo "::error::Timed out waiting for CI to conclude on $SHA."
          echo "::error::Re-run this job once CI finishes, or delete the tag if CI failed."
          exit 1

  release:
    needs: [build, build-wasm, linux-ffi-smoke, ci-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > "$RUNNER_TEMP/gpg-key.asc"
          chmod 600 "$RUNNER_TEMP/gpg-key.asc"
          gpg --batch --import "$RUNNER_TEMP/gpg-key.asc"
          rm "$RUNNER_TEMP/gpg-key.asc"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Bundle portable libraries
        # Pack the whole lib/ tree, never an enumerated subset: listing
        # lib/srfi/ and lib/chibi/ here is how lib/kaappi/ was silently
        # missing from every release tarball v0.18.0–v0.21.0, making the
        # documented (kaappi parallel) unimportable on stock installs (#1741).
        run: tar czf kaappi-lib.tar.gz lib/ LICENSE

      - name: Collect binaries, generate checksums, and sign
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'kaappi-*' -o -name 'kaappi.wasm' -o -name 'thottam-*' -o -name 'libkaappi_rt-*' \) -exec cp {} release/ \;
          cp kaappi-lib.tar.gz release/
          cd release
          sha256sum kaappi-* kaappi.wasm thottam-* libkaappi_rt-* kaappi-lib.tar.gz > SHA256SUMS
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback --detach-sign --armor SHA256SUMS

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract section for this version from CHANGELOG.md
          NOTES=$(sed -n "/^## \[${TAG#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d' || echo "Release $TAG")
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # action-gh-release talks to the API with the workflow token
      # (contents: write above); it performs no git operations, so
      # disabled checkout credentials don't affect it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: release/*
