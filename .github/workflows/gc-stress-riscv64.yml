name: GC stress (riscv64 native tier)

# Scheduled run of the riscv64 native-backend e2e parity suite against a
# libkaappi_rt.a built with -Dgc-stress=true (kaappi#2594): a collection is
# attempted at every allocation the native code makes through the runtime
# bridge, so a rooting bug in emitted code or in runtime_exports.zig -- a
# heap value held across a kaappi_* call without a kaappi_gc_push_root slot,
# a quote/eval cache entry the collector cannot see -- fails at the site
# that caused it instead of surviving as latent corruption. The per-PR
# `gc-stress` and `gc-stress-scheme` jobs in ci.yml cover the interpreter on
# the host; nothing per-PR runs the native tier against a stress archive,
# and riscv64 is the tier's newest and least-exercised arch, where a
# different stack layout and allocation order can surface a bug the two
# established arches have never tripped (lessons-learned #20).
#
# Not per-PR: ci.yml's riscv64-native-test (the plain-archive sibling this
# job is a copy of) is already the leg that runs ~115 container starts under
# QEMU; the stress archive costs another `zig build lib` plus ~15% on the
# emulated run (measured locally: 82 s plain vs 94 s stress for 39/39 under
# podman on Apple Silicon), and a rooting bug in the native tier is not what
# a typical PR changes. A separate workflow rather than a job in fuzz.yml:
# fuzz.yml's trailing `report` job auto-files issues for its job set with
# fuzz-specific verdicts, and a parity failure here is a different kind of
# finding (reproduce it on aarch64/x86_64 first -- docs/dev/llvm-backend.md,
# "Testing"), so it must not be filed as a fuzz-infrastructure verdict.
#
# The kaappi binary is built normally and only the archive with gc-stress:
# the interpreter is the parity oracle and must not itself be slowed 30x
# under TCG, and the archive is the whole GC the native binaries link.
# `KAAPPI_CROSS_PREFIX` hands run-e2e-cross.sh the prebuilt pair instead of
# letting it cross-build its own plain one. Everything else -- pinned image,
# pinned riscv64 Zig for the on-target `kaappi compile` smoke -- mirrors
# riscv64-native-test; keep the two in step.

on:
  schedule:
    # Daily at 03:17 UTC -- after fuzz.yml (02:47) and before the 05:17 UTC
    # ecosystem nightly, so a red run is attributable to that day's main.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      programs:
        description: 'Space-separated program basenames (without .scm) from tests/e2e/programs to run instead of all of them, e.g. "tak native-fib". The argv and on-target smoke phases always run.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  riscv64-native-gc-stress:
    runs-on: ubuntu-latest
    # A hang bound, not a budget: the plain sibling completes in ~6.5 min
    # end to end on a hosted runner, and the stress archive adds well under
    # a minute of host build plus ~15% on the emulated phase. A rooting bug
    # can present as a collector livelock rather than a panic, and the
    # `timeout` on the run step below fails the step -- with the per-program
    # PASS/FAIL lines already in the log -- before this cap cancels the job.
    timeout-minutes: 30
    env:
      # ziglang.org/download/index.json, 0.16.0 -> riscv64-linux.shasum.
      RV_ZIG_SHA256: bc069b0f2f568f54bafbdfc1d65b12fd386ed6a652044a37aee6a4f72f14076e
      # riscv64/ubuntu:24.04 as of 2026-09-07; bump the digest deliberately,
      # together with ci.yml's riscv64-native-test.
      RV_IMAGE: riscv64/ubuntu:24.04@sha256:f28b71827ff6cb4fe9b6b536b583bc0227072516de20c9225847be7722ab5715
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: gc-stress-riscv64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: riscv64

      - name: Fetch a riscv64 Zig (the on-target C compiler for the smoke)
        run: |
          mkdir -p "$RUNNER_TEMP/zig-rv"
          curl -sSL -o "$RUNNER_TEMP/zig-rv/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-riscv64-linux-0.16.0.tar.xz
          echo "$RV_ZIG_SHA256  $RUNNER_TEMP/zig-rv/zig.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/zig-rv/zig.tar.xz" -C "$RUNNER_TEMP/zig-rv"
          echo "RV_ZIG=$(echo "$RUNNER_TEMP"/zig-rv/zig-riscv64-linux-*/zig)" >> "$GITHUB_ENV"

      - name: Pull the riscv64 base image
        run: docker pull --platform linux/riscv64 "$RV_IMAGE"

      # One prefix, two builds: the interpreter (the oracle, and the emitter
      # that produces each program's IR) with the default GC, the archive
      # with a collection forced at every allocation. Both are ReleaseSafe,
      # so the freed-owner UAF panic string is compiled in ONLY under
      # -Dgc-stress (memory.uaf_detection) -- its presence in the archive is
      # the proof that the option reached the `lib` step, the way
      # tools/run-gc-stress-suite.sh refuses a binary whose `features` does
      # not report gc_stress. A plain archive would make this leg a slower
      # copy of riscv64-native-test that reports green for the wrong reason.
      - name: Cross-build kaappi (default GC) and libkaappi_rt.a (gc-stress)
        run: |
          prefix="$RUNNER_TEMP/rv-stress"
          zig build -Dtarget=riscv64-linux --prefix "$prefix"
          zig build lib -Dtarget=riscv64-linux -Dgc-stress=true --prefix "$prefix"
          if ! grep -a -q "marking freed object" "$prefix/lib/libkaappi_rt.a"; then
            echo "::error::$prefix/lib/libkaappi_rt.a lacks the gc-stress UAF-detection code; -Dgc-stress did not reach the archive"
            exit 1
          fi

      - name: Native-backend e2e against the gc-stress archive (riscv64 via QEMU)
        env:
          KAAPPI_E2E_PROGRAMS: ${{ inputs.programs || '' }}
        run: |
          export TMPDIR="$RUNNER_TEMP"
          export KAAPPI_CROSS_PREFIX="$RUNNER_TEMP/rv-stress"
          export KAAPPI_EMU="docker run --rm --platform linux/riscv64 -v $PWD:$PWD -v $RUNNER_TEMP:$RUNNER_TEMP -w $PWD $RV_IMAGE"
          # Strictly below `timeout-minutes` so a livelocked program fails
          # the step on its own terms and the log keeps every PASS/FAIL line
          # printed before it; a cancelled job loses nothing here but reads
          # as infrastructure rather than as a finding.
          timeout --signal=TERM --kill-after=60s 22m \
            bash tests/e2e/run-e2e-cross.sh riscv64-linux "$RV_ZIG"

  # Who hears about a red run. Without this, a nightly that goes red is
  # visible only to whoever browses the Actions tab. Same shape as fuzz.yml's
  # `report` -- a separate job, so the issues-write token never coexists
  # with execution of the emulated binaries -- but it files one plain issue
  # (run link, verdict, the suite's PASS/FAIL tail) with none of fuzz.yml's
  # verdict machinery: a parity failure against the stress archive is a
  # GC-rooting bug to reproduce on the host first (docs/dev/llvm-backend.md,
  # "Testing"), not a fuzz finding. No checkout: nothing here needs the
  # repo, and the evidence is read from this run's own job log and
  # annotations via the `actions: read` token.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: riscv64-native-gc-stress
    # `cancelled()` as well as `failure()` -- fuzz.yml's lesson (#2040),
    # verbatim: the run step's `timeout` yields a FAILURE, but a job killed
    # by its own `timeout-minutes` is CANCELLED, so `failure()` alone would
    # skip this job for exactly the livelock the cap exists to catch. A
    # manual or concurrency cancellation is `cancelled()` too; the step
    # below files nothing unless the job carries the job-timeout annotation.
    if: failure() || cancelled()
    permissions:
      issues: write
      actions: read # this run's job log and check-run annotations
    steps:
      - name: File or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: riscv64-native-gc-stress
          RESULT: ${{ needs.riscv64-native-gc-stress.result }}
          TITLE: gc-stress riscv64 nightly failed
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          doc_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/dev/llvm-backend.md#testing"

          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate \
                  | jq -r --arg n "$JOB_NAME" '.jobs[] | select(.name == $n) | [.id, .conclusion] | @tsv' \
                  | head -1 || true)
          jid=$(printf '%s' "$job" | cut -f1)

          # The job-timeout message lives ONLY in the check-run annotations;
          # a cancelled job's log blob is often never archived at all.
          anns=""
          [ -z "$jid" ] || anns=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$jid/annotations" --jq '.[].message' 2>/dev/null || true)
          timed_out=""
          if printf '%s' "$anns" | grep -qF 'exceeded the maximum execution time'; then timed_out=1; fi

          if [ "$RESULT" != failure ] && [ -z "$timed_out" ]; then
            echo "::notice::$JOB_NAME was '$RESULT' without a job-timeout annotation (a manual or concurrency cancellation); filing nothing"
            exit 0
          fi

          # The suite's own lines out of the runner log (each line carries a
          # timestamp prefix): per-program PASS/FAIL, the expected/actual
          # pairs under a FAIL, the phase headers, and the summary line.
          jlog="job.log"; : > "$jlog"
          [ -z "$jid" ] || gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$jid/logs" > "$jlog" 2>/dev/null || true
          tail_lines=$(grep -E 'PASS: |FAIL: |=== |error: |::error::|^[^ ]+   (expected|actual|emit|verify|cc|compile)' "$jlog" \
                         | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' | tail -60 || true)

          if [ -n "$timed_out" ]; then
            verdict='the job **exceeded its `timeout-minutes` cap** and was cancelled: the setup or cross-build steps overran, or the run step outlived its own 22m `timeout`. Treat it as a possible collector livelock until shown otherwise.'
          elif printf '%s\n' "$tail_lines" | grep -q 'FAIL: '; then
            verdict='at least one program **failed parity** against the gc-stress archive -- a wrong answer, a crash, or an exit-status mismatch (the expected/actual pair under each FAIL line says which).'
          elif printf '%s\n' "$tail_lines" | grep -q 'PASS: ' && ! printf '%s\n' "$tail_lines" | grep -q 'Cross E2E Summary'; then
            verdict='the run step'"'"'s 22m `timeout` **killed the suite mid-run** with no summary line: the program after the last PASS (alphabetical order of `tests/e2e/programs/`) is the one that hung under the stress archive -- a possible collector livelock.'
          else
            verdict='the job failed **before the parity loop** -- setup, cross-build, the gc-stress archive check, or the emulator; see the run log.'
          fi

          {
            printf 'Automated report from the [GC stress (riscv64 native tier) workflow](%s) -- [run #%s](%s) (`%s`).\n\n' \
              "$run_url" "$GITHUB_RUN_NUMBER" "$run_url" "$GITHUB_EVENT_NAME"
            printf '**Verdict:** %s\n\n' "$verdict"
            printf 'Triage: [docs/dev/llvm-backend.md, Testing](%s). A parity failure against the `-Dgc-stress=true` archive is a GC-rooting bug in the emitted code or the runtime bridge, not a riscv64 bug (lessons-learned #20): reproduce that one program on the host first with the recipe there, and narrow a run with `gh workflow run gc-stress-riscv64.yml -f programs="<name> ..."`.\n\n' \
              "$doc_url"
            printf '<details><summary>Suite output (PASS/FAIL tail)</summary>\n\n```\n'
            if [ -n "$tail_lines" ]; then printf '%s\n' "$tail_lines"; else printf '(no suite output in the job log -- it may not have been archived; open the run)\n'; fi
            printf '```\n</details>\n'
          } > body.md

          # Dedup by exact title among open issues, as fuzz.yml does: a red
          # run appends to the open issue instead of filing a second one.
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
                  --json number,title | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body-file body.md
            echo "::notice::Appended the failure report to existing issue #$num"
          else
            {
              printf '> [!NOTE]\n> Close this issue once the failure is explained or fixed; until then, further red runs append comments here instead of opening new issues.\n\n'
              printf '> Filed `priority: high` because a parity FAIL is a silently wrong answer from a legal program -- `high` under docs/dev/github-issues.md -- and at filing time it cannot be told apart from a hang or an infrastructure failure. Relabel to `medium` (or `low` for pure infrastructure) once triage says which.\n\n---\n\n'
              cat body.md
            } > full-issue.md
            created=$(gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" \
              --label ci --label gc --label native-backend --label "priority: high" \
              --body-file full-issue.md)
            echo "::notice::Filed $created"
          fi
