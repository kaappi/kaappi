name: PR Benchmark Comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'lib/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/benchmark-pr.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-pr:
    # A PR from a fork gets a read-only GITHUB_TOKEN, so the comparison
    # step's PR comment would fail after two full builds and two benchmark
    # runs. Skip the whole job instead: this check is not required, so a
    # skipped job costs nothing (docs/dev/github-actions.md), and the
    # maintainer can run the comparison locally before merging if the
    # change looks performance-sensitive.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 brings all refs during checkout, so the later
      # base/head `git checkout <sha>` steps are purely local and need
      # no git credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Zig (PR branch)
        uses: xyzzylabs/setup-zig@ab632f9cc6f98d89d3b8f2c2e1577a929d0e70f3 # v1.0.4
        with:
          version: 0.17.0

      # The base branch has to be built and benchmarked too, and while the
      # toolchain bump is only in the PR, `main` still needs 0.16.0 to
      # configure — 0.17 rejects its `.ReleaseSafe` (kaappi#2609). So fetch a
      # second toolchain into its own prefix and call it by absolute path for
      # the base run rather than putting two `zig`s on PATH. Using ONE
      # toolchain for both was the original intent and is wrong the moment the
      # branches disagree; using 0.17 for both cannot build the base at all.
      #
      # This whole step goes away once the bump is on `main` and both sides
      # configure with the setup-zig version above.
      - name: Fetch Zig 0.16.0 for the base branch
        env:
          # ziglang.org/download/index.json, 0.16.0 -> x86_64-linux.shasum.
          BASE_ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          mkdir -p "$RUNNER_TEMP/zig-base"
          curl -sSL -o "$RUNNER_TEMP/zig-base/zig.tar.xz" \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "$BASE_ZIG_SHA256  $RUNNER_TEMP/zig-base/zig.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/zig-base/zig.tar.xz" -C "$RUNNER_TEMP/zig-base"
          echo "BASE_ZIG=$(echo "$RUNNER_TEMP"/zig-base/zig-x86_64-linux-*/zig)" >> "$GITHUB_ENV"

      - name: Build and benchmark PR branch
        run: |
          zig build
          bash benchmarks/run-benchmarks.sh --json > pr-results.json

      - name: Build and benchmark base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          "$BASE_ZIG" build
          bash benchmarks/run-benchmarks.sh --json > base-results.json
          git checkout ${{ github.event.pull_request.head.sha }}

      - name: Compare and comment
        uses: kaappi/github-action-pull-request-benchmark@1a82ba746b2050a6143f3e4ab67d935e505f7b73 # v1 tag (2026-07-01)
        with:
          tool: 'raw'
          pr-benchmark-file-path: pr-results.json
          base-benchmark-file-path: base-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # This gate re-measures both branches from scratch on a shared GitHub
          # runner, and its own base-vs-base spread reaches ~1.62x for the same
          # commit (kaappi#1906). A 120% threshold sat well inside that noise, so
          # a red check meant nothing. 175% is above the measured noise floor yet
          # still flags a genuine >=2x regression. Tightening it back toward 120%
          # only makes sense once the comparison interleaves repeated A/B rounds
          # (kaappi#1906 direction 3) rather than one PR block then one base block.
          alert-threshold: '175%'
          comment-always: true
