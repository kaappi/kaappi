name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  # Read-only, for the changed-path classifier in `format` below. Remember
  # that a job-level `permissions:` block replaces this one wholesale rather
  # than merging (docs/dev/github-actions.md) -- `benchmark` has its own.
  pull-requests: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # 'true' only when every changed path is provably inert. Consumers gate
      # on `!= 'true'`, so an empty or missing value still runs the matrix.
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # A docs-only PR used to pay the full ~194 runner-minutes and 20-30 min
      # of wall clock for nothing, and 11 of the 40 PRs before #2214 touched
      # no code at all.
      #
      # This classifier lives in `format` rather than in a dedicated `changes`
      # job on purpose, and the reason is the whole safety argument. A skipped
      # job reports Success to branch protection ("A job that is skipped will
      # report its status as 'Success'. It will not prevent a pull request
      # from merging, even if it is a required check"), and a job whose
      # `needs` failed is itself skipped -- so a standalone gate job that
      # errored would turn all seven heavy required contexts green with
      # nothing built, on a branch that requires no approving review. `format`
      # is already a required context AND already every heavy job's `needs`,
      # so a broken classifier here is a red required check instead of a
      # silent pass.
      #
      # Workflow-level `paths:` cannot be used for the same reason in reverse:
      # a workflow that does not run never reports, and the required checks
      # sit "Expected -- Waiting for status to be reported" forever. Job-level
      # `if:` both skips the work and satisfies the check -- BUT ONLY FOR A
      # STANDALONE JOB, whose required context is the job name itself (wasm,
      # riscv64-test, ...). A skipped MATRIX job does not expand into its per-leg
      # names, so the five required `test (os, optimize)` contexts were never
      # reported and every docs-only PR was unmergeable (kaappi#2337). The `test`
      # job below therefore does NOT carry a job-level `if:` -- it always runs and
      # short-circuits per-step on `env.DOCS_ONLY`. Do not "simplify" it back to a
      # job-level skip.
      #
      # Allowlist, never denylist: a path nobody anticipated must fall through
      # to running everything. `.github/workflows/**` is the thing under test
      # and `.claude/**` holds executable hooks, so neither is inert -- but a
      # `.md` under either is, because nothing in CI reads one. Every
      # `docs/`-or-`.md` reference in build.zig, tools/, src/tests_*.zig and
      # tests/scheme/**/*.sh is a comment, so no markdown change can fail the
      # suites this skips. A skill's `evals/evals.json` is inert for the same
      # reason: it is consumed by the skill-eval harness, never by a
      # workflow, so a PR touching only a SKILL.md and its sibling evals
      # file still skips the matrix.
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The REST API, not `git diff`: it needs no fetch-depth: 0, and it
          # gives push and pull_request the same shape. Both endpoints
          # truncate large changesets (3000 files for a PR, 300 for a commit),
          # and a truncated list could read as all-inert -- so anything at or
          # past the smaller cap runs the full matrix rather than guessing.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
              --jq '.[].filename')
          else
            files=$(gh api \
              "repos/${{ github.repository }}/commits/${{ github.sha }}" \
              --jq '.files[].filename')
          fi

          count=$(printf '%s\n' "$files" | grep -c . || true)
          docs_only=true
          reason=""

          if [ "$count" -eq 0 ]; then
            docs_only=false
            reason="no changed paths reported"
          elif [ "$count" -ge 300 ]; then
            docs_only=false
            reason="$count changed paths -- at the API truncation cap"
          else
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                *.md|docs/*|LICENSE|.claude/skills/*/evals/*.json) ;;
                *) docs_only=false; reason="$f is not an inert path"; break ;;
              esac
            done <<< "$files"
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          {
            echo "### Changed-path classification"
            echo
            if [ "$docs_only" = "true" ]; then
              echo "\`docs_only=true\` -- $count inert path(s), skipping the build/test matrix."
            else
              echo "\`docs_only=false\` -- running the full matrix ($reason)."
            fi
            echo
            echo '```'
            printf '%s\n' "$files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0

      - name: Format check
        run: zig fmt --check src/

      # A bare `return <set>.TypeError/IndexOutOfBounds/InvalidArgument` reaches
      # the user through mapNativeError/mapFfiError's fallback, which names the
      # primitive but reports args[0] as the offending value -- so every such
      # return must instead use primitives.typeError/indexError/argError, or
      # carry a `// bare-ok: <reason>` when it is an infrastructure guard with no
      # procedure context (see kaappi#1874).
      #
      # kaappi#2026 widened this gate on two axes at once: it now scans all of
      # src/ (not just src/primitives*.zig, which missed src/ffi.zig entirely)
      # and both spellings -- `error.Foo` as well as `PrimitiveError.Foo` /
      # `VMError.Foo` -- across the whole taxonomy, not TypeError alone. ffi.zig
      # is clean; a backlog of bare IndexOutOfBounds/InvalidArgument in the
      # primitives (kaappi#2020/#2021/#2022) is not, so this is once again a
      # ratchet, exactly as it was for TypeError (91 -> 20 -> 0, cleared by
      # kaappi#1868). The #2020/#2021/#2022 sweep cleared all 18
      # primitives_string_ext.zig sites (28 -> 10); what remains is
      # VM-infrastructure guards in vm_calls/vm_dispatch_helpers/
      # vm_continuations/fiber_wait plus two primitives_io/primitives_fiber
      # guards. BASELINE may only go DOWN: lower it whenever you remove a
      # bare return, and delete it when it reaches 0. Test files legitimately
      # write `error.TypeError` in `expectError`, so src/tests_*.zig is excluded.
      - name: Check bare error-taxonomy regression
        run: |
          BASELINE=9
          hits=$(grep -rnE 'return (PrimitiveError|VMError|error)\.(TypeError|IndexOutOfBounds|InvalidArgument)' src/*.zig \
                 | grep -v '^src/tests_' | grep -v 'bare-ok' || true)
          count=$(printf '%s' "$hits" | grep -c . || true)
          echo "Unannotated bare error-taxonomy returns: $count (baseline $BASELINE)."
          if [ "$count" -gt "$BASELINE" ]; then
            printf '%s\n' "$hits"
            echo "::error::Bare error-taxonomy returns rose to $count (baseline $BASELINE)."
            echo "Use primitives.typeError/indexError/argError with a procedure name,"
            echo "or add '// bare-ok: <reason>' for an infrastructure guard that has no"
            echo "procedure context (kaappi#1874). Do not raise BASELINE."
            exit 1
          fi
          if [ "$count" -lt "$BASELINE" ]; then
            echo "::warning::Bare error-taxonomy returns dropped to $count -- lower BASELINE to $count in .github/workflows/ci.yml."
          fi

      # Globs, ignores, and the rule set all live in .markdownlint-cli2.jsonc,
      # so `npx markdownlint-cli2` locally lints exactly what this step does.
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  # There is deliberately no CHANGELOG gate here. One existed until #2103
  # dropped it, because concurrent PRs appending under [Unreleased] conflict
  # with each other on the same few lines; #2475 brought it back with a wider
  # scope and the conflicts came back with it. CHANGELOG.md is now written at
  # release time from `git log` (`/github-release` Step 2) and PRs do not edit
  # it -- the commit body is where the "why" goes, since that is what the
  # release notes are written from.

  test:
    needs: format
    # Deliberately NOT gated `if: docs_only != 'true'` at the job level, unlike
    # every other build job below. This job's matrix legs ARE the required
    # status checks in branch protection (`test (ubuntu-latest, ReleaseSafe)`
    # etc.). A skipped matrix job does not expand into its per-leg check names --
    # GitHub reports one check under the raw template `test (${{ matrix.os }},
    # ${{ matrix.optimize }})`, so the five required names sit "Expected --
    # Waiting for status" forever and every docs-only PR is unmergeable
    # (kaappi#2337; same symptom as the PR #1728 rename footgun below, different
    # cause). The other jobs skip cleanly only because their required context is
    # the job name itself. So this job always runs and the matrix always expands;
    # the docs-only short-circuit is per-step via `env.DOCS_ONLY` instead, so
    # each leg still reports success on a docs-only PR without doing the work.
    # ANY NEW STEP below must carry `if: env.DOCS_ONLY != 'true'` (ANDed with its
    # own condition), or it will run on docs-only PRs.
    env:
      DOCS_ONLY: ${{ needs.format.outputs.docs_only }}
    # Explicit name, deliberately NOT including matrix.timeout: this job's
    # auto-generated name would otherwise fold in every matrix property
    # present for a given combination (including include-only ones like
    # timeout), so bumping the Debug leg's timeout below silently renamed
    # its check from "test (ubuntu-latest, Debug, 30)" to "...Debug, 40" --
    # and since branch protection requires that exact string, the renamed
    # check can never be satisfied again (PR #1728 review response hit
    # this directly: the old name sat "Expected -- Waiting for status to
    # be reported" forever). Pinning the name to just os+optimize means a
    # future timeout tweak can never repeat this.
    name: test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    # Successful runs of every leg sit at 15-23 min (Linux Release legs
    # 15-18, macOS 18-23), so a 20-min cap leaves only minutes of headroom
    # and ordinary runner variance cancels healthy runs mid-suite — it hit
    # macOS ReleaseSafe repeatedly on main and then ubuntu ReleaseFast on
    # PR #1635. 30 min was the hang-bound the Debug and riscv64 jobs used;
    # the timeout exists to catch hangs, not to race the suite. But by
    # PR #1728 the Debug leg's own healthy runtime had crept up to 29-30.5
    # min (measured directly: a clean run completed in 29:03, then two
    # more timed out at 30:16 and 30:21 with no error in the log besides
    # the runner terminating orphaned zig/build processes at the 30:00
    # mark) -- the suite had grown enough that 30 min stopped being a
    # hang-bound and started being exactly what the comment above says to
    # avoid. Bumped to 40 to restore real headroom, same fix as the
    # macOS/PR #1635 recurrence.
    timeout-minutes: ${{ matrix.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        optimize: [ReleaseSafe]
        include:
          - os: ubuntu-latest
            optimize: Debug
            timeout: 40
          # macOS runners are slower and the suite has outgrown the 30-min
          # default here: a clean ReleaseSafe run now lands at ~35 min (build
          # ~2, unit tests ~10, Scheme suites ~18+), so the cap cancels healthy
          # runs mid-suite — the recurrence the timeout comment above predicted
          # ("hit macOS ReleaseSafe repeatedly"). 40 restored headroom, same as
          # the Debug leg, until a slow runner ate that too: PR #2481's re-run
          # (2026-09-02) was cancelled at 40:04 on its LAST step with every
          # suite green — build 4, unit tests 13.5, Scheme suites 21.5 min.
          # 50 leaves ~10 min over that run while still catching a real hang
          # (healthy runs sit at 18–24 min). timeout is an include-only key
          # that merges into this existing os+optimize combination without
          # renaming its required check.
          - os: macos-latest
            optimize: ReleaseSafe
            timeout: 50
          - os: ubuntu-latest
            optimize: ReleaseFast

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        if: env.DOCS_ONLY != 'true'
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: ${{ matrix.optimize }}

      - name: Build
        if: env.DOCS_ONLY != 'true'
        run: zig build -Doptimize=${{ matrix.optimize }}

      # Kaappi ships only final SRFIs. Fail if the binary reports a SRFI whose
      # status in the canonical registry is draft/withdrawn. Runs once (needs a
      # binary; the enumeration comes from `kaappi features --json`). Exit 77 =
      # SKIP (registry unreachable) so a network blip never reds the leg.
      - name: SRFI final-status guard
        if: matrix.os == 'ubuntu-latest' && matrix.optimize == 'ReleaseSafe' && env.DOCS_ONLY != 'true'
        run: |
          set +e
          bash tools/check-srfi-status.sh zig-out/bin/kaappi
          code=$?
          set -e
          if [ "$code" -eq 77 ]; then
            echo "::warning::SRFI final-status check skipped (registry unreachable)"
            exit 0
          fi
          exit "$code"

      # --summary all deliberately: `zig build test` prints NOTHING on success,
      # so a passing run and a run that compiled everything and executed no
      # test produce byte-identical logs. The summary's `run test unit-tests
      # N pass` line is the only thing that tells them apart, and it is what
      # the gc-stress job below is read against (its skip count differs).
      - name: Unit tests (leak detection via std.testing.allocator)
        if: env.DOCS_ONLY != 'true'
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

      - name: Scheme suites
        if: env.DOCS_ONLY != 'true'
        run: bash tests/scheme/run-all.sh
        env:
          # srfi231-official.scm joins the Debug-only skip for the same reason as
          # callcc-bench: it is the one allocation-heavy file whose ReleaseSafe
          # runtime (~77s warm, ~150s with the isolated cold cache) times 10-20x
          # under Debug -- well past even its own 600s run-all override. The
          # hand-written srfi231*.scm suites still run stressed and Debug.
          KAAPPI_TEST_SKIP: ${{ matrix.optimize == 'Debug' && 'callcc-bench.scm r7rs-tail-procedures-gaps.scm r7rs-thin-forms-gaps.scm srfi231-official.scm' || '' }}
          # Debug is 10-20x slower on allocation-heavy work, so the 60s
          # per-file default is the wrong budget for it: the macro-expansion
          # suites (srfi257*.scm) already sit within seconds of the cliff on a
          # fast laptop. The timeout is here to catch hangs, not to race the
          # slowest legitimate suite.
          KAAPPI_TEST_TIMEOUT: ${{ matrix.optimize == 'Debug' && '240' || '' }}
          # The compile suite's -Dbundle fixture build recompiles the whole
          # interpreter (~180s on an idle 4-core runner, per kaappi#1926) and
          # the Debug leg builds it cold (the Build step above only warms this
          # leg's own optimize), so under runner load it has sat within seconds
          # of the 300s default and flaked (kaappi#2232). Give the shell suites
          # the same "catch hangs, don't race the slowest legitimate build"
          # budget the per-file timeout above gives the .scm suites.
          KAAPPI_SHELL_TEST_TIMEOUT: '600'

      - name: Sandbox escape tests
        if: env.DOCS_ONLY != 'true'
        run: bash tests/scheme/sandbox/sandbox-escape.sh

      - name: Parallel pool sandbox degradation tests
        if: env.DOCS_ONLY != 'true'
        run: bash tests/scheme/sandbox/parallel-degrades.sh

      - name: Sysinfo sandbox degradation tests
        if: env.DOCS_ONLY != 'true'
        run: bash tests/scheme/sandbox/sysinfo-degrades.sh

      - name: Robustness tests
        if: env.DOCS_ONLY != 'true'
        run: bash tests/scheme/robustness/robustness.sh

      - name: E2E tests (LLVM native backend)
        if: matrix.optimize == 'ReleaseSafe' && env.DOCS_ONLY != 'true'
        run: |
          git clone --depth 1 https://github.com/kaappi/kaappi-bdd.git ../kaappi-bdd
          bash tests/e2e/run-e2e.sh

      - name: thottam integration test
        if: matrix.optimize == 'ReleaseSafe' && env.DOCS_ONLY != 'true'
        run: |
          export KAAPPI_HOME=$(mktemp -d)
          zig-out/bin/thottam list
          zig-out/bin/thottam install kaappi-json
          zig-out/bin/thottam list | grep kaappi-json
          zig-out/bin/thottam verify
          echo '(import (kaappi json)) (display (json-write-string (list 1 2 3))) (newline)' | zig-out/bin/kaappi --lib-path "$KAAPPI_HOME/lib"
          zig-out/bin/thottam remove kaappi-json
          ! zig-out/bin/thottam list | grep kaappi-json
          rm -rf "$KAAPPI_HOME"

  # -------------------------------------------------------------------------
  # gc-stress: a collection is ATTEMPTED AT EVERY ALLOCATION.
  #
  # This is the only configuration that turns a GC rooting bug -- a heap value
  # held in a Zig local across an allocation without `gc.pushRoot` -- from
  # rare, unattributable corruption into a deterministic failure at the site
  # that caused it (.claude/rules/gc-safety.md; #1401 crashed ~440 of 690 tests
  # this way, #1687 added the freed-owner sentinel and quarantine that make it
  # panic instead of aliasing by luck).
  #
  # Until audit v2 Phase 7E no pull request was ever gated on it (#1898):
  # `-Dgc-stress` appeared 0 times in this file. It was not absent from CI
  # altogether -- fuzz.yml's two gc-stress legs run this same unit suite as
  # their pre-fuzz phase -- but daily at 02:47 UTC against whatever landed that
  # day, not against the diff that introduced it. On a green nightly the
  # difference is nothing; on a red one it is the difference between a named
  # PR and a bisect.
  #
  # WHY IT IS AFFORDABLE NOW, WHEN IT WAS NOT WHEN THAT SPLIT WAS DECIDED.
  # The cost fell by roughly 30x with #1802/#1804 and #1809, which stopped
  # ReleaseSafe 0xAA-filling `= undefined` buffers. Both surviving estimates
  # predate that and are stale by about that factor: .claude/skills/
  # do-stress-test said "1.5-3 hours" until Phase 5F measured 5 min and
  # corrected it, and fuzz.yml still says "~35 min locally on M-series" beside
  # a 300-minute timeout. Measured on hosted runners by fuzz.yml itself, its
  # WHOLE gc-stress leg -- checkout, Zig, build, this unit suite, and 100 fuzz
  # runs across 7 targets -- completes in 10-13 min (10m20s / 12m22s on
  # 2026-08-01; 12m54s / 12m58s on 2026-07-31).
  #
  # WALL CLOCK. Both jobs below hang off `format` and run concurrently with
  # everything else. The critical path through this workflow is
  # `test (ubuntu-latest, Debug)` at 19 min, with riscv64-test and netbsd-test
  # at 17 and the macOS/OpenBSD legs at 16 (last main run). Staying inside that
  # shadow is the design constraint, and it is why the unit suite and the
  # Scheme corpus are two jobs rather than two steps of one: serialised they
  # would exceed 19 min and become the new critical path; in parallel each is
  # comfortably under it and the cost is CPU minutes, which this workflow
  # already spends 18 legs' worth of.
  gc-stress:
    needs: format
    if: needs.format.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Not a budget -- a hang bound. A rooting bug can present as a livelock in
    # the collector rather than a crash, and that must not sit until the job
    # limit. Healthy runs are ~10 min (see above).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: gc-stress

      # `--summary all` is load-bearing here, not decoration. `zig build test`
      # prints nothing on success, so this step's log would be identical
      # whether it ran 1582 tests or zero -- and a build flag that silently
      # fails to apply is exactly the failure mode a stress gate has (Phase 5F
      # nearly reported a false clean on it). The summary line is the evidence:
      # a stressed run reports `1582 pass` where the plain legs above report
      # `1579 pass, 3 skip`, because three tests opt out of stress builds
      # (#1447, #1452, src/tests_fuzz.zig). Different counts, same suite.
      - name: Unit tests (collection on every allocation)
        run: zig build test -Dgc-stress=true --summary all

  # The Scheme half. Not redundant with the unit suite above: these 600+ files
  # drive the library loader, the macro expander and all 178 SRFIs at a scale
  # no Zig unit test reaches, and src/tests_gc_root_boundary.zig's own OOM
  # sweeps find leaks *only* in the expander. Before Phase 5F ran it by hand on
  # a droplet, the Scheme corpus had never executed against a stress build at
  # all; this makes it a gate rather than a one-off.
  gc-stress-scheme:
    needs: format
    if: needs.format.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: gc-stress-scheme

      - name: Build (gc-stress)
        run: zig build -Dgc-stress=true

      # Nothing about running a .scm file reveals which build options produced
      # the binary, so a plain build would pass every assertion in the suite
      # and the job would go green having stressed nothing. The script refuses
      # to run unless `kaappi features --json` reports gc_stress:true; this
      # step is the same check, hoisted so a mis-build fails in one second
      # instead of ten minutes.
      - name: Confirm the flag applied
        run: zig-out/bin/kaappi features --json | grep -q '"gc_stress":true'

      - name: Scheme corpus + R7RS suite (gc-stress binary)
        run: bash tools/run-gc-stress-suite.sh zig-out/bin/kaappi
        env:
          # Two kinds of exclusion, both temporary, both named.
          #
          # (a) TOO SLOW UNDER STRESS -- same knob, same spelling and the same
          #     reason as the Debug leg's KAAPPI_TEST_SKIP above. Stress
          #     collection costs O(live heap) per allocation, so a file that
          #     allocates against a large live heap is quadratic:
          #     trampoline-polish-1375.scm builds a 300,000-character string
          #     and maps over it -- ~0.2 s plain, and it had not finished
          #     after 25 minutes stressed, while the other 602 files completed
          #     in 11 minutes in aggregate on the same run. srfi14.scm
          #     (Unicode inversion lists) and srfi264.scm are the same shape at
          #     ~10 and ~9 minutes. reader-port-refill-gaps.scm sweeps ~800
          #     chunk-boundary fixtures, each an incremental `read` that
          #     re-parses a 4 KiB buffer per refill (~1 s plain, exit 124 at
          #     the 900 s stress timeout on this job's first run against it,
          #     PR #2174); the incomplete-input reader mode it guards gets its
          #     stress coverage from src/tests_reader_incremental.zig in the
          #     gc-stress unit job instead. srfi178-segment-stack-2084.scm
          #     builds a 200,000-element bitvector list to pin #2084's
          #     tail-recursion fix past the 32,768 frame cap -- ~0.1 s plain,
          #     exit 124 stressed (measured quadratic: ~3 min at 40k on a
          #     fast machine); the n = 0 guard half of #2084 stays stressed
          #     in srfi178-audit.scm. srfi231-official.scm is the same shape at
#     suite scale -- 8,778 evaluations plus PGM convolutions over a
#     512x512 image, every element an allocation against the whole live
#     heap (~77s warm unstressed); the hand-written srfi231*.scm suites
#     keep the SRFI stress-covered. srfi166-audit.scm streams a
          #     50,000-element list through the token writer to pin #2344's
          #     iterative (non-recursing) written/pretty stack-safety -- ~0.1 s
          #     plain, exit 124 stressed since each emitted token allocates
          #     against the whole live list (and its parallel lane starves a
          #     sibling into a timeout too); the full 285-assertion audit still
          #     runs unstressed on every other leg.
          #
          # (b) REAL BUGS THIS GATE FOUND ON ITS FIRST RUN -- excluded so the
          #     gate is green for everything else, exactly as the campaign
          #     comments out a failing assertion behind a `;; FAIL: #N` marker
          #     rather than leaving the suite red. Each fix PR deletes its
          #     names from this list -- #2160 (primitives_srfi1-audit.scm,
          #     srfi1-ext.scm, srfi1-gc-stress.scm) and #2161
          #     (primitives_srfi237-audit.scm, srfi237.scm, srfi240-audit.scm)
          #     are gone from it for that reason, leaving:
          #       #2027  srfi18-deepcopy-matrix-audit.scm's section E binds a
          #              child-created ffi_function returned through
          #              thread-join!, which is aliased rather than copied --
          #              so the parent holds a pointer into the freed child
          #              heap and the next FULL collection marks it. The file
          #              already documents the cell as `FAIL: #2027` and never
          #              dereferences the handle; the panic comes from the
          #              collector, not from an assertion, so commenting one
          #              out cannot avoid it. Newly visible because #2127
          #              taught a joined child to hand its freed slots to the
          #              parent's quarantine -- before that this exact UAF ran
          #              green here, which was the point of #2127.
          #
          # Listing a file here removes its stressed Scheme run entirely --
          # fuzz.yml's gc-stress legs run fuzz targets and the Zig unit
          # suite, never this corpus. Every listed file still runs plain
          # under run-all.sh on every other leg, so nothing is untested,
          # only unstressed; where the guarded behavior has a counterpart,
          # that half keeps stress coverage (tests_reader_incremental.zig in
          # the gc-stress unit job for reader-port-refill-gaps.scm, and
          # srfi178-audit.scm, still in this run, for the n = 0 half of
          # srfi178-segment-stack-2084.scm).
          #
          # The script FAILS if a name here matches no file, so this list
          # cannot rot into a silent no-op.
          KAAPPI_GC_STRESS_SKIP: >-
            trampoline-polish-1375.scm srfi14.scm srfi264.scm
            srfi166-audit.scm reader-port-refill-gaps.scm
            srfi178-segment-stack-2084.scm srfi18-deepcopy-matrix-audit.scm
            srfi231-official.scm

  riscv64-test:
    needs: format
    if: needs.format.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # QEMU user-mode overhead puts this leg at 27-32m on main (kaappi#2458
    # raised the cap from 30 to 45 when it was 16-27m and ~1 in 15 runs was
    # killed on timing alone). KEP-0022 adds to it: every child a process
    # test spawns is a whole /bin/sh emulated through binfmt, so this job
    # pays a multiple of what those tests cost natively.
    #
    # Since 2026-09-02 about 1 run in 4 is killed at the cap while STILL in
    # the unit-test step at 41-43m -- 15m past the slowest success -- with
    # the `unit-tests` binary alive: a hang, not a slow tail (kaappi#2488).
    # That step printed nothing until it finished, so the log said nothing
    # about which test. The unit suite therefore runs as chunks
    # (tools/run-unit-test-chunk.sh), each its own step with its own
    # `timeout-minutes`, so the next hang names its chunk. The first
    # three-way split measured 35m healthy and localised the first
    # recurrence to its `rest` chunk (1646 tests); the eight-way split below
    # cuts that remainder along its QEMU-sensitive seams at the price of
    # five more test-binary compiles (~1.5m each).
    #
    # The chunk script also passes `zig build test --test-timeout` (8m by
    # default; see its header). That is what localises to a TEST: the build
    # runner otherwise waits forever for a test's result, and with the bound
    # it kills the overrunning test, prints its name, and carries on with
    # the rest of the chunk, so the log ends with a named failure and a full
    # verdict for every other test instead of a cancel. For that to happen
    # the step must outlive the per-test bound, so every step cap below is
    # its healthy time plus the 8m bound plus margin -- the cap is now the
    # backstop, not the localiser. The job cap backstops the same way: setup
    # + build + every chunk healthy (30m) + one hung test (8m) stays inside.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: riscv64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: riscv64

      - name: Build (cross-compile for riscv64)
        run: zig build -Dtarget=riscv64-linux

      # Chunks, not one step: see the job comment and the script's header.
      # Measured under QEMU on the three-way split (jobs 33674064049 and
      # 100407731878): process 1.4-1.9m, concurrency 3.3-5.4m, the old
      # 1646-test rest 25.8m healthy and hung once at its 36m cap -- each
      # figure including the chunk's own test-binary compile. The five
      # chunks carved out of that remainder measured natively io 11s,
      # fuzz 1m, gc 9s, native 2s (skips on this tier), tooling and the new
      # rest ~3m; the QEMU factor on the old rest was ~3.3x on top of
      # ~1.5m of compile, which is what the caps below are sized from, with
      # roughly 2x headroom each -- and then the script's 8m per-test bound
      # on top, so a hung test is killed and NAMED by `zig build` while the
      # step is still alive (a step cap that fires first would lose the
      # name again). Measured healthy times on the eight-way split under
      # QEMU, two runs (33684320694 and PR #2491's), slowest of each:
      # process 1.8m, concurrency 7.0m (3.3m on the other run -- the
      # timing-sensitive chunk varies most with runner load), io 2.1m,
      # fuzz 6.0m, gc 6.1m (2.9m), native 1.7m, tooling 2.1m, rest 6.9m.
      - name: Unit tests, process chunk (riscv64 via QEMU)
        timeout-minutes: 14
        run: bash tools/run-unit-test-chunk.sh process -Dtarget=riscv64-linux

      - name: Unit tests, concurrency chunk (riscv64 via QEMU)
        timeout-minutes: 20
        run: bash tools/run-unit-test-chunk.sh concurrency -Dtarget=riscv64-linux

      - name: Unit tests, io chunk (riscv64 via QEMU)
        timeout-minutes: 14
        run: bash tools/run-unit-test-chunk.sh io -Dtarget=riscv64-linux

      - name: Unit tests, fuzz chunk (riscv64 via QEMU)
        timeout-minutes: 20
        run: bash tools/run-unit-test-chunk.sh fuzz -Dtarget=riscv64-linux

      - name: Unit tests, gc chunk (riscv64 via QEMU)
        timeout-minutes: 18
        run: bash tools/run-unit-test-chunk.sh gc -Dtarget=riscv64-linux

      - name: Unit tests, native chunk (riscv64 via QEMU)
        timeout-minutes: 12
        run: bash tools/run-unit-test-chunk.sh native -Dtarget=riscv64-linux

      - name: Unit tests, tooling chunk (riscv64 via QEMU)
        timeout-minutes: 14
        run: bash tools/run-unit-test-chunk.sh tooling -Dtarget=riscv64-linux

      - name: Unit tests, rest chunk (riscv64 via QEMU)
        timeout-minutes: 24
        run: bash tools/run-unit-test-chunk.sh rest -Dtarget=riscv64-linux

      - name: R7RS test suite (riscv64 via QEMU)
        run: bash tools/run-r7rs-suite.sh zig-out/bin/kaappi

      # The little-endian control for the same step on s390x below: every
      # assertion in these suites is either host-independent or derived from
      # `%host-big-endian?`, so a failure here means the suite itself is wrong,
      # not that the host's byte order is.
      - name: Endian-sensitive Scheme suites (riscv64 via QEMU)
        run: bash tools/run-endian-suite.sh zig-out/bin/kaappi

  # s390x: interpreter tier like riscv64 (#1654), and the only big-endian
  # target in the matrix — a permanent canary for byte-order bugs in the
  # `.sbc` codec and any future serialization. Also validated on a
  # real-kernel Alpine s390x VM (unit + thottam + R7RS + full Scheme
  # suites; user VA stays below 2^42, inside the 48-bit NaN-box payload).
  s390x-test:
    needs: format
    if: needs.format.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: s390x

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: s390x

      - name: Build (cross-compile for s390x)
        run: zig build -Dtarget=s390x-linux

      # Same per-test bound as the riscv64 chunks (kaappi#2488): a test that
      # hangs under emulation is killed and named after 8m, and the rest of
      # the suite still reports, instead of the step going silent until the
      # job cap. This leg's whole unit step is ~10m healthy.
      - name: Unit tests (s390x via QEMU)
        run: zig build test -Dtarget=s390x-linux --test-timeout 8m

      - name: R7RS test suite (s390x via QEMU)
        run: bash tools/run-r7rs-suite.sh zig-out/bin/kaappi

      # THE POINT OF THE CANARY (audit v2, Phase 7C). Until this step, the
      # three things that ran here were the build, the unit suite and
      # `r7rs-tests.scm` -- and `r7rs-tests.scm` imports no SRFI with a
      # byte-order-sensitive surface, so SRFI 74 (blobs), 160 (host-native
      # numeric-vector storage) and 135 (UTF-16) had never executed on a
      # big-endian machine at all. `run-all.sh` is too heavy for an emulated
      # leg; this runs just the files that carry endian assertions, in about
      # a second natively. See tools/run-endian-suite.sh.
      - name: Endian-sensitive Scheme suites (s390x via QEMU)
        run: bash tools/run-endian-suite.sh zig-out/bin/kaappi

  # ppc64le: interpreter tier like riscv64 (#1654). Also validated on a
  # real-kernel Alpine ppc64le VM (unit + thottam + R7RS + full Scheme
  # suites; 128 TB = 2^47 default map window fits the NaN-box payload).
  ppc64le-test:
    needs: format
    if: needs.format.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: ppc64le

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: ppc64le

      - name: Build (cross-compile for ppc64le)
        run: zig build -Dtarget=powerpc64le-linux

      # Per-test bound as on the s390x and riscv64 legs (kaappi#2488); this
      # unit step is ~4m healthy.
      - name: Unit tests (ppc64le via QEMU)
        run: zig build test -Dtarget=powerpc64le-linux --test-timeout 8m

      - name: R7RS test suite (ppc64le via QEMU)
        run: bash tools/run-r7rs-suite.sh zig-out/bin/kaappi

      # POWER is little-endian in this configuration despite the architecture
      # family's big-endian history, so this is a control leg, not a second
      # canary -- worth stating, because "ppc64le covers big-endian too" is an
      # easy and wrong assumption to make from the job list.
      - name: Endian-sensitive Scheme suites (ppc64le via QEMU)
        run: bash tools/run-endian-suite.sh zig-out/bin/kaappi

  # FreeBSD: cross-compile the binaries and test executables from Linux
  # (guarding the cross-compilation path release.yml ships with), then
  # boot a FreeBSD VM via KVM on the same runner — GitHub hosts no
  # FreeBSD runners — and execute the unit suite, the thottam suite, and
  # the full Scheme suite inside it. Same build-anywhere/execute-on-target
  # idea as windows-cross → windows-arm-test, collapsed into one job
  # because the VM shares the workspace (no artifact handoff needed).
  # The VM tracks the oldest supported release line (Zig's bundled
  # FreeBSD libc floor is 14.0); the port's reference machine runs
  # 15.1 aarch64 (docs/dev/freebsd.md).
  freebsd-test:
    needs: format
    if: needs.format.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: freebsd

      - name: Build (cross-compile for x86_64-freebsd)
        # Includes the native runtime archive: inside the VM, the
        # compile-suite scripts that need no zig themselves (e.g.
        # native-rebind-stale-call-822.sh) link `kaappi compile` output
        # against zig-out/lib/libkaappi_rt.a with the base system cc.
        run: |
          zig build -Dtarget=x86_64-freebsd
          zig build lib -Dtarget=x86_64-freebsd

      - name: Compile unit tests (x86_64-freebsd)
        # skip_foreign_checks makes this compile-and-skip on the Linux
        # host; the binaries are executed inside the VM below. ls -t picks
        # the binaries this run compiled — the restored Zig cache can hold
        # stale ones from earlier runs.
        run: |
          zig build test -Dtarget=x86_64-freebsd
          cp "$(ls -t .zig-cache/o/*/unit-tests | head -1)" ./unit-tests-freebsd
          cp "$(ls -t .zig-cache/o/*/thottam-tests | head -1)" ./thottam-tests-freebsd

      - name: Trim workspace for VM sync
        # The VM step rsyncs the whole workspace into the guest; the Zig
        # cache is by far its largest tree and nothing in the VM needs it.
        run: rm -rf .zig-cache

      - name: Run test suites (FreeBSD VM)
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          release: "14.3"
          usesh: true
          sync: rsync
          copyback: false
          # bash: run-all.sh; python3 + git: the errors/ and test-runner/
          # suites validate JSON output and build throwaway git repos.
          prepare: pkg install -y bash python3 git
          run: |
            set -e
            ./unit-tests-freebsd
            ./thottam-tests-freebsd
            cc -shared -fPIC tests/scheme/ffi/fixtures/u64test.c -o tests/scheme/ffi/fixtures/libu64test.so
            bash tests/scheme/run-all.sh

  # OpenBSD: cross-compile the x86_64 binaries + test executables on Linux,
  # mark them PT_OPENBSD_NOBTCFI (Zig 0.16 emits no BTI landing pads, which
  # OpenBSD's BTCFI enforcement requires — docs/dev/openbsd.md), then execute
  # inside a KVM OpenBSD VM (GitHub hosts no OpenBSD runners). The VM tracks
  # 7.9 to match the aarch64 reference machine; OpenBSD breaks ABI between
  # releases, so the Zig-targeted release and the VM release must agree.
  openbsd-test:
    needs: format
    if: needs.format.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: openbsd

      - name: Build (cross-compile for x86_64-openbsd)
        # zig build marks the three installed binaries PT_OPENBSD_NOBTCFI via
        # the host patcher (build.zig installExe). The runtime archive lets the
        # VM's compile-suite scripts link `kaappi compile` output with base cc.
        run: |
          zig build -Dtarget=x86_64-openbsd
          zig build lib -Dtarget=x86_64-openbsd

      - name: Compile and mark unit tests (x86_64-openbsd)
        # skip_foreign_checks makes this compile-and-skip on the Linux host;
        # the binaries execute inside the VM below. ls -t picks the binaries
        # this run compiled. Test executables are not installed artifacts, so
        # the NOBTCFI marker is applied explicitly with the same host tool.
        run: |
          zig build test -Dtarget=x86_64-openbsd
          cp "$(ls -t .zig-cache/o/*/unit-tests | head -1)" ./unit-tests-openbsd
          cp "$(ls -t .zig-cache/o/*/thottam-tests | head -1)" ./thottam-tests-openbsd
          # -lc: the tool uses libc I/O (std.c.pread/pwrite), which `zig run`
          # links implicitly on macOS but not on this Linux host.
          zig run tools/openbsd_nobtcfi.zig -lc -- ./unit-tests-openbsd ./thottam-tests-openbsd

      - name: Trim workspace for VM sync
        run: rm -rf .zig-cache

      - name: Run test suites (OpenBSD VM)
        uses: vmactions/openbsd-vm@e6c68b637a12e83519688d115d57d5b0b53923cd # v1
        with:
          release: "7.9"
          usesh: true
          sync: rsync
          copyback: false
          # bash: run-all.sh; python3 + git: the errors/ and test-runner/
          # suites validate JSON output and build throwaway git repos.
          prepare: pkg_add -I bash python%3 git
          run: |
            set -e
            # OpenBSD's default login class caps the main-thread stack at 4 MiB
            # and the data segment at 1.5 GiB. The test runner recurses on the
            # main thread, and std.testing's DebugAllocator never reuses freed
            # address space, so raise both to the hard limits before running the
            # unit-test binary (docs/dev/openbsd.md).
            ulimit -s $(ulimit -Hs)
            ulimit -d $(ulimit -Hd)
            ./unit-tests-openbsd
            ./thottam-tests-openbsd
            cc -shared -fPIC tests/scheme/ffi/fixtures/u64test.c -o tests/scheme/ffi/fixtures/libu64test.so
            bash tests/scheme/run-all.sh

  netbsd-test:
    needs: format
    if: needs.format.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: netbsd

      - name: Build (cross-compile for x86_64-netbsd)
        # The runtime archive lets the VM's compile-suite scripts link
        # `kaappi compile` output with pkgsrc clang (NetBSD's base cc is GCC,
        # which cannot consume LLVM IR — docs/dev/netbsd.md).
        run: |
          zig build -Dtarget=x86_64-netbsd
          zig build lib -Dtarget=x86_64-netbsd

      - name: Compile unit tests (x86_64-netbsd)
        # skip_foreign_checks makes this compile-and-skip on the Linux host;
        # the binaries execute inside the VM below. ls -t picks the binaries
        # this run compiled.
        run: |
          zig build test -Dtarget=x86_64-netbsd
          cp "$(ls -t .zig-cache/o/*/unit-tests | head -1)" ./unit-tests-netbsd
          cp "$(ls -t .zig-cache/o/*/thottam-tests | head -1)" ./thottam-tests-netbsd

      - name: Trim workspace for VM sync
        run: rm -rf .zig-cache

      - name: Run test suites (NetBSD VM)
        uses: vmactions/netbsd-vm@6334c835de4c04a59fe59f0f8f071e02a2f0bab3 # v1
        with:
          release: "10.1"
          usesh: true
          sync: rsync
          copyback: false
          # 6 GiB: std.testing's DebugAllocator commits ~4 GiB cumulative
          # over the unit suite (poisoned freed pages are never unmapped)
          # and the vmactions image has no swap configured — the 4 GiB
          # reference machine needed a swapfile for the same reason
          # (docs/dev/netbsd.md).
          mem: 6144
          # bash: run-all.sh; python3 + git: the errors/ and test-runner/
          # suites validate JSON output and build throwaway git repos;
          # clang: the compile/ suite needs an LLVM-capable driver (base cc
          # is GCC). Retried: cdn.netbsd.org intermittently truncates or
          # 503s large package downloads.
          prepare: |
            for i in 1 2 3; do
              /usr/sbin/pkg_add -I bash git-base clang && break
              sleep 20
            done
            /usr/sbin/pkg_add -I python313 || /usr/sbin/pkg_add -I python312
            for v in 3.13 3.12; do
              if [ -x /usr/pkg/bin/python$v ]; then ln -sf /usr/pkg/bin/python$v /usr/pkg/bin/python3; break; fi
            done
            command -v clang || { echo "clang install failed"; exit 1; }
          run: |
            set -e
            # NetBSD's defaults cap the main-thread stack at 8 MiB (soft) and
            # the data segment at 4 GiB. The test runner recurses on the main
            # thread, and the DebugAllocator grows monotonically, so raise
            # both to the hard limits (64 MiB / 64 GiB) before running the
            # unit-test binary (docs/dev/netbsd.md).
            ulimit -s $(ulimit -H -s)
            ulimit -d $(ulimit -H -d)
            ./unit-tests-netbsd
            ./thottam-tests-netbsd
            cc -shared -fPIC tests/scheme/ffi/fixtures/u64test.c -o tests/scheme/ffi/fixtures/libu64test.so
            bash tests/scheme/run-all.sh

  # Cross-compile the Windows binaries and the unit-test binary from
  # Linux, once per arch. Compile-only by design: this guards the
  # cross-compilation path release.yml ships with, independent of the
  # Windows runner images. Execution is covered by windows-arm-test and
  # windows-x64-test below.
  windows-cross:
    needs: format
    if: needs.format.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@df7066a4910fe13f4643390dbbd8ce6a785fff63 # v1.0.3
        with:
          version: 0.16.0
          cache-key: windows-cross-${{ matrix.arch }}

      - name: Build (cross-compile for ${{ matrix.arch }}-windows)
        # `lib` builds kaappi_rt.lib — windows-x64-test links against it
        # in the native-backend e2e step.
        run: |
          zig build -Dtarget=${{ matrix.arch }}-windows
          zig build lib -Dtarget=${{ matrix.arch }}-windows

      - name: Compile unit tests (${{ matrix.arch }}-windows)
        # The host can't execute the foreign test binaries; the build's
        # Run steps set skip_foreign_checks, so this compiles everything
        # and skips execution — a plain compile gate with normal error
        # propagation.
        run: |
          zig build test -Dtarget=${{ matrix.arch }}-windows
          ls .zig-cache/o/*/unit-tests.exe

      - name: Stage binaries for the Windows test jobs
        # ls -t picks the exe this run compiled — the restored Zig cache
        # can hold stale unit-tests.exe from earlier runs.
        run: |
          mkdir -p win-stage
          cp zig-out/bin/kaappi.exe zig-out/bin/thottam.exe zig-out/bin/kaappi-lsp.exe win-stage/
          cp zig-out/lib/kaappi_rt.lib win-stage/
          cp "$(ls -t .zig-cache/o/*/unit-tests.exe | head -1)" win-stage/
          cp "$(ls -t .zig-cache/o/*/thottam-tests.exe | head -1)" win-stage/

      - name: Cross-compile FFI test fixture
        # uint64-range.scm dlopens this; the Windows test jobs drop it
        # into tests/scheme/ffi/fixtures/ — the arm job has no toolchain
        # (#1613).
        run: zig cc -target ${{ matrix.arch }}-windows-gnu -shared tests/scheme/ffi/fixtures/u64test.c -o win-stage/libu64test.dll

      - name: Upload binaries for the Windows test jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-binaries
          path: win-stage/
          retention-days: 3

  # Execute the suite on real Windows ARM64 via GitHub's hosted
  # windows-11-arm runners (free for public repos): the unit suite, the
  # thottam suite + install/remove integration (#1609), the R7RS suite,
  # the .scm suites verified on the port's reference VM
  # (docs/dev/windows.md), including the FFI suite (#1611) against the
  # cross-compiled fixture DLL, and the shell-based suites (#1612) under
  # the runner's Git Bash. The binaries come cross-compiled from
  # windows-cross — Zig 0.16.0 cannot compile natively on Windows ARM64
  # (zig build/build-exe access-violate on any project, #1613) — so this
  # job installs no toolchain and only executes; the compile/ suite
  # (which rebuilds with zig on the box) self-skips for the same reason.
  windows-arm-test:
    needs: windows-cross
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      # The Windows runner images set core.autocrlf=true; the Scheme
      # suites compare exact output, so check out files as committed.
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-aarch64-binaries
          path: bin

      - name: Unwrap archived artifact
        # Safety net only: named downloads extract the artifact contents
        # into `path` directly (loose files, so this loop normally has
        # nothing to do — the wrapper-zip belief was a misdiagnosis, #1620).
        # Windows ships bsdtar, which extracts zip if one ever appears.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for z in bin/*.zip; do tar -xf "$z" -C bin && rm -f "$z"; done
          ls -l bin

      - name: Stage FFI test fixture
        # uint64-range.scm opens tests/scheme/ffi/fixtures/libu64test
        # relative to the repo root this job runs the suites from.
        shell: bash
        run: cp bin/libu64test.dll tests/scheme/ffi/fixtures/

      - name: Create tmp directories
        # Tests write scratch files under /tmp/..., which kaappi.exe
        # resolves to \tmp on the current drive (docs/dev/windows.md).
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\tmp | Out-Null
          $drive = (Get-Location).Path.Substring(0, 2)
          New-Item -ItemType Directory -Force -Path "$drive\tmp" | Out-Null

      - name: Unit tests
        shell: bash
        run: bin/unit-tests.exe

      - name: thottam unit tests
        shell: bash
        run: bin/thottam-tests.exe

      - name: thottam integration test
        # Mirrors the POSIX test job's step: a real install of the
        # pure-Scheme kaappi-json (Git for Windows is preinstalled on the
        # runner), imported through the installed lib dir, then removed —
        # which deletes a real git clone, whose read-only pack files are
        # the Windows-specific removal hazard (#1609). KAAPPI_HOME is a
        # C:/-style path (pwd -W): thottam hands paths straight to git.exe
        # and the CRT, which never see git-bash's /d/... spellings.
        shell: bash
        run: |
          export KAAPPI_HOME="$(pwd -W)/thottam-home"
          bin/thottam.exe list
          bin/thottam.exe install kaappi-json
          bin/thottam.exe update kaappi-json
          bin/thottam.exe list | grep kaappi-json
          bin/thottam.exe verify
          echo '(import (kaappi json)) (display (json-write-string (list 1 2 3))) (newline)' > use-json.scm
          bin/kaappi.exe --lib-path "$KAAPPI_HOME/lib" use-json.scm
          bin/thottam.exe remove kaappi-json
          ! bin/thottam.exe list | grep kaappi-json
          rm -f use-json.scm

      - name: R7RS test suite
        shell: bash
        run: bash tools/run-r7rs-suite.sh bin/kaappi.exe

      - name: Scheme suites (VM-verified subset)
        shell: bash
        run: |
          # `process` joined the list with KEP-0022 Phase 3 (#2416): the
          # POSIX-child suites in it self-skip on Windows, and
          # process-portable.scm runs the OS-independent matrix with kaappi
          # itself as the child — which needs $KAAPPI and a writable scratch
          # dir, exactly as run-all.sh provides on POSIX.
          export KAAPPI="$(pwd -W)/bin/kaappi.exe"
          export KAAPPI_HOME="$(pwd -W)/scheme-suite-home"
          mkdir -p scheme-suite-home
          fail=0
          for dir in smoke compliance continuations hygiene srfi ffi process audit; do
            for f in tests/scheme/$dir/*.scm; do
              if bin/kaappi.exe "$f" > out.log 2>&1; then
                echo "  PASS  $f"
              else
                echo "  FAIL  $f"
                cat out.log
                fail=1
              fi
            done
          done
          rm -f out.log
          exit $fail

      - name: Shell suites (#1612)
        # The bash-driven drivers, under the runner's Git Bash. Exit 77 =
        # SKIP (tests/scheme/shell-common.sh): a script whose premise cannot
        # hold on Windows — the compile/ suite needs a native Zig toolchain
        # (#1613) — reports itself instead of failing. KAAPPI_HOME is
        # isolated like run-all.sh does, so suites never touch a real cache.
        #
        # The directory list mirrors run-all.sh's, plus sandbox and
        # robustness (which run-all.sh leaves to CI). completions, lsp,
        # thottam and differential were outside it until #2220 — which is
        # how completions/completions.sh came to fail on Windows unobserved
        # for as long as it did. Expect two of the four to report SKIP here:
        # thottam-lifecycle.sh builds git fixtures at POSIX paths, and
        # run-wasm-differential.sh wants wasmtime. run-differential.sh is
        # the expensive one at ~9 min on the reference VM, roughly tripling
        # this step; the job sits ~6 min against its timeout, so it fits.
        shell: bash
        run: |
          # Some drivers validate JSON with python3; the arm image ships
          # Python as `python`, so shim python3 when the name is missing.
          # ($HOME, not $RUNNER_TEMP: a Windows-spelled dir in bash's PATH
          # would not resolve for bash's own lookup.)
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$HOME/.pyshim"
            printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/.pyshim/python3"
            chmod +x "$HOME/.pyshim/python3"
            export PATH="$HOME/.pyshim:$PATH"
          fi
          export KAAPPI=bin/kaappi.exe
          export KAAPPI_HOME="$RUNNER_TEMP/kaappi-test-home"
          fail=0
          for dir in smoke errors compile test-runner pipeline doctor fmt cache timings \
                     completions lsp thottam differential sandbox robustness; do
            for s in tests/scheme/$dir/*.sh; do
              [ -e "$s" ] || continue
              # `|| status=$?`: the runner's `shell: bash` implies -e, which
              # would otherwise abort the whole step on the first SKIP (77).
              status=0
              out=$(KAAPPI="$KAAPPI" bash "$s" "$KAAPPI" 2>&1) || status=$?
              if [ "$status" -eq 0 ]; then
                echo "  PASS  $s"
              elif [ "$status" -eq 77 ]; then
                echo "  SKIP  $s"
              else
                echo "  FAIL  $s (exit $status)"
                printf '%s\n' "$out"
                fail=1
              fi
            done
          done
          exit $fail

  # Execute the same suite set on x86_64 Windows via the standard
  # windows-latest runners, from the cross-compiled x86_64 artifacts
  # (guarding the binaries release.yml ships), plus the native-backend
  # e2e suite (tests/e2e/run-e2e.ps1, #1610) — possible only on this
  # arch: Zig 0.16.0 works natively on x86_64 Windows, while the
  # aarch64 toolchain access-violates compiling anything (#1613, an
  # aarch64-only LLVM COFF bug). Zig is installed only after the shell
  # suites so both Windows jobs run them under identical no-toolchain
  # conditions (the bundle-rebuild scripts gate on a toolchain being
  # present).
  windows-x64-test:
    needs: windows-cross
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # The Windows runner images set core.autocrlf=true; the Scheme
      # suites compare exact output, so check out files as committed.
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x86_64-binaries
          path: bin

      - name: Unwrap archived artifact
        # Safety net only: named downloads extract the artifact contents
        # into `path` directly (loose files, so this loop normally has
        # nothing to do — the wrapper-zip belief was a misdiagnosis, #1620).
        # Windows ships bsdtar, which extracts zip if one ever appears.
