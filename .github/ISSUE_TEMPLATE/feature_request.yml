name: Feature request
description: Suggest a new procedure, form, library, or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Substantial changes (a new runtime subsystem, a language- or
        library-surface change, a build-model change) go through the KEP
        process at <https://github.com/kaappi/keps> rather than an issue.
        Ideas that are not yet concrete are best raised in Discussions.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The situation you were in and what you could not do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do it in a library instead" and "do nothing".
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: R7RS sections, SRFI numbers, how other Schemes handle it.
